<!DOCTYPE html>

<html>

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    紫微斗數預約諮詢
  </title>


  <style>

    :root {

      --bg: #f8f5fb;

      --card: #ffffff;

      --text: #2d2833;

      --muted: #766f7e;

      --primary: #7d5a93;

      --primary-dark: #68477e;

      --border: #e6dfea;

      --danger: #b54848;

      --success: #467a58;

    }


    * {

      box-sizing: border-box;

    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          180deg,
          #f4eef8 0%,
          var(--bg) 45%,
          #ffffff 100%
        );

    }


    .wrap {

      width:
        min(
          760px,
          calc(100% - 32px)
        );

      margin:
        36px auto 64px;

    }


    .hero {

      text-align:
        center;

      margin-bottom:
        24px;

    }


    .hero h1 {

      font-size:
        30px;

      margin:
        0 0 10px;

      letter-spacing:
        0.04em;

    }


    .hero p {

      margin: 0;

      color:
        var(--muted);

      line-height:
        1.8;

    }


    .card {

      background:
        var(--card);

      border:
        1px solid
        var(--border);

      border-radius:
        20px;

      padding:
        24px;

      margin-bottom:
        18px;

      box-shadow:
        0 10px 30px
        rgba(
          66,
          45,
          80,
          .06
        );

    }


    h2 {

      font-size:
        18px;

      margin:
        0 0 18px;

    }


    .grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          1fr
        );

      gap:
        16px;

    }


    .field {

      margin-bottom:
        16px;

    }


    label {

      display:
        block;

      font-weight:
        700;

      margin-bottom:
        8px;

      font-size:
        14px;

    }


    input,
    select,
    textarea {

      width:
        100%;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;

      padding:
        13px 14px;

      font-size:
        16px;

      outline:
        none;

      background:
        #ffffff;

    }


    textarea {

      min-height:
        120px;

      resize:
        vertical;

    }


    input:focus,
    select:focus,
    textarea:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(
          125,
          90,
          147,
          .1
        );

    }


    .option-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          1fr
        );

      gap:
        14px;

    }


    .option {

      position:
        relative;

    }


    .option input {

      position:
        absolute;

      opacity:
        0;

      pointer-events:
        none;

    }


    .option label {

      display:
        block;

      margin:
        0;

      padding:
        18px;

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      cursor:
        pointer;

      text-align:
        center;

      transition:
        .18s ease;

    }


    .option input:checked + label {

      border-color:
        var(--primary);

      background:
        #f7f1fa;

      box-shadow:
        0 0 0 2px
        rgba(
          125,
          90,
          147,
          .12
        );

    }


    .option-title {

      font-size:
        17px;

      font-weight:
        800;

      margin-bottom:
        6px;

    }


    .option-desc {

      color:
        var(--muted);

      font-size:
        13px;

      line-height:
        1.6;

    }


    .topics {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          1fr
        );

      gap:
        10px;

    }


    .topic {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;

      padding:
        12px;

      font-size:
        14px;

    }


    .topic input {

      width:
        auto;

    }


    .btn {

      width:
        100%;

      border:
        none;

      border-radius:
        14px;

      padding:
        15px 18px;

      font-size:
        16px;

      font-weight:
        800;

      background:
        var(--primary);

      color:
        #ffffff;

      cursor:
        pointer;

      transition:
        .18s ease;

    }


    .btn:hover {

      background:
        var(--primary-dark);

    }


    .btn:disabled {

      opacity:
        .55;

      cursor:
        not-allowed;

    }


    .hint {

      color:
        var(--muted);

      font-size:
        13px;

      margin-top:
        8px;

      line-height:
        1.6;

    }


    .status {

      margin-top:
        14px;

      font-size:
        14px;

      line-height:
        1.7;

    }


    .error {

      color:
        var(--danger);

    }


    .success {

      color:
        var(--success);

    }


    .success-card {

      display:
        none;

      text-align:
        center;

      padding:
        34px 24px;

    }


    .success-card h2 {

      font-size:
        24px;

      margin-bottom:
        12px;

    }


    .success-card p {

      color:
        var(--muted);

      line-height:
        1.8;

    }


    .line-link {

      display:
        inline-block;

      margin-top:
        14px;

      color:
        var(--primary);

      font-weight:
        800;

      text-decoration:
        none;

    }


    @media (
      max-width: 640px
    ) {

      .wrap {

        width:
          min(
            100% - 20px,
            760px
          );

        margin-top:
          20px;

      }


      .grid,
      .option-grid,
      .topics {

        grid-template-columns:
          1fr;

      }


      .card {

        padding:
          18px;

        border-radius:
          16px;

      }


      .hero h1 {

        font-size:
          25px;

      }

    }

  </style>

</head>


<body>


<div class="wrap">


  <div id="formArea">


    <div class="hero">

      <h1>
        紫微斗數預約諮詢
      </h1>

      <p>
        選擇適合你的老師與時段，
        完成後系統會自動建立預約。
      </p>

    </div>


    <form id="bookingForm">


      <!-- =====================
           01 基本資訊
      ====================== -->

      <div class="card">

        <h2>
          01｜基本資訊
        </h2>


        <div class="grid">


          <div class="field">

            <label for="name">
              姓名 *
            </label>

            <input
              id="name"
              name="name"
              required
            >

          </div>


          <div class="field">

            <label for="gender">
              性別 *
            </label>

            <select
              id="gender"
              name="gender"
              required
            >

              <option value="">
                請選擇
              </option>

              <option value="男">
                男
              </option>

              <option value="女">
                女
              </option>

              <option value="其他">
                其他
              </option>

            </select>

          </div>


        </div>


        <div class="grid">


          <div class="field">

            <label for="lineId">
              LINE ID
            </label>

            <input
              id="lineId"
              name="lineId"
            >

          </div>


          <div class="field">

            <label for="igAccount">
              IG 帳號（聯繫用） *
            </label>

            <input
              id="igAccount"
              name="igAccount"
              placeholder="例如：@yourname"
              required
            >

            <div class="hint">
              預約相關聯繫將以 IG 為主。
            </div>

          </div>


        </div>


      </div>



      <!-- =====================
           02 出生資訊
      ====================== -->

      <div class="card">

        <h2>
          02｜出生資訊
        </h2>


        <div class="grid">


          <div class="field">

            <label for="birthDate">
              出生年月日
            </label>

            <input
              id="birthDate"
              name="birthDate"
              type="date"
            >

          </div>


          <div class="field">

            <label for="birthTime">
              出生時間
            </label>

            <input
              id="birthTime"
              name="birthTime"
              type="time"
            >

            <div class="hint">
              若不知道可留空。
            </div>

          </div>


        </div>


        <div class="field">

          <label for="birthPlace">
            出生地
          </label>

          <input
            id="birthPlace"
            name="birthPlace"
            placeholder="例如：台北市"
          >

        </div>


      </div>



      <!-- =====================
           03 老師
      ====================== -->

      <div class="card">

        <h2>
          03｜選擇老師
        </h2>

        <div
          id="teacherGrid"
          class="option-grid"
        ></div>

      </div>



      <!-- =====================
           04 諮詢方式
      ====================== -->

      <div class="card">

        <h2>
          04｜選擇諮詢方式
        </h2>


        <div class="option-grid">


          <div class="option">

            <input
              type="radio"
              id="consultOnline"
              name="consultType"
              value="線上"
              required
            >

            <label for="consultOnline">

              <div class="option-title">
                線上諮詢
              </div>

              <div class="option-desc">
                不受地點限制，
                可線上進行諮詢
              </div>

            </label>

          </div>


          <div class="option">

            <input
              type="radio"
              id="consultOffline"
              name="consultType"
              value="現場"
              required
            >

            <label for="consultOffline">

              <div class="option-title">
                現場諮詢
              </div>

              <div class="option-desc">
                面對面諮詢，
                更有親切感！
              </div>

            </label>

          </div>


        </div>

      </div>



      <!-- =====================
           05 日期時間
      ====================== -->

      <div class="card">

        <h2>
          05｜選擇日期與時間
        </h2>


        <div class="grid">


          <div class="field">

            <label for="date">
              日期 *
            </label>

            <input
              id="date"
              name="date"
              type="date"
              required
              disabled
            >

          </div>


          <div class="field">

            <label for="time">
              時間 *
            </label>

            <select
              id="time"
              name="time"
              required
              disabled
            >

              <option value="">
                請先選擇老師、諮詢方式與日期
              </option>

            </select>

          </div>


        </div>


        <div
          id="slotStatus"
          class="status"
        ></div>


      </div>



      <!-- =====================
           06 主題
      ====================== -->

      <div class="card">

        <h2>
          06｜你想聊什麼？
        </h2>


        <div class="topics">


          <label class="topic">

            <input
              type="checkbox"
              name="topics"
              value="感情／婚姻"
            >

            感情／婚姻

          </label>


          <label class="topic">

            <input
              type="checkbox"
              name="topics"
              value="事業／轉職"
            >

            事業／轉職

          </label>


          <label class="topic">

            <input
              type="checkbox"
              name="topics"
              value="財運／投資"
            >

            財運／投資

          </label>


          <label class="topic">

            <input
              type="checkbox"
              name="topics"
              value="流年運勢"
            >

            流年運勢

          </label>


          <label class="topic">

            <input
              type="checkbox"
              name="topics"
              value="天賦／人生方向"
            >

            天賦／人生方向

          </label>


          <label class="topic">

            <input
              type="checkbox"
              name="topics"
              value="其他"
            >

            其他

          </label>


        </div>

      </div>



      <!-- =====================
           07 問題
      ====================== -->

      <div class="card">

        <h2>
          07｜想詢問的問題
        </h2>


        <div class="field">

          <label for="question">
            最近遇到什麼問題？希望老師特別看什麼？
          </label>

          <textarea
            id="question"
            name="question"
            placeholder="可以簡單描述目前最想釐清的事情。"
          ></textarea>

        </div>


      </div>



      <button
        id="submitBtn"
        class="btn"
        type="submit"
      >
        確認送出預約
      </button>


      <div
        id="submitStatus"
        class="status"
      ></div>


    </form>


  </div>



  <!-- =====================
       預約成功
  ====================== -->

  <div
    id="successArea"
    class="card success-card"
  >

    <h2>
      預約成功
    </h2>


    <p
      id="successText"
    ></p>


    <a
      id="lineLink"
      class="line-link"
      href="#"
      target="_blank"
      style="display:none;"
    >
      前往官方 LINE
    </a>


  </div>


</div>



<script>


let publicConfig =
  null;


let selectedTeacher =
  '';


let selectedConsultType =
  '';



document.addEventListener(

  'DOMContentLoaded',

  init

);



/* =========================
   初始化
========================= */

function init() {


  google.script.run

    .withSuccessHandler(
      setupPage
    )

    .withFailureHandler(
      showFatal
    )

    .getPublicConfig();



  document
    .getElementById(
      'date'
    )

    .addEventListener(

      'change',

      loadSlots

    );



  document
    .querySelectorAll(
      'input[name="consultType"]'
    )

    .forEach(
      input => {


        input.addEventListener(

          'change',

          e => {


            selectedConsultType =
              e.target.value;


            updateDateAvailability();


            if (

              selectedTeacher

              &&

              selectedConsultType

              &&

              document
                .getElementById(
                  'date'
                )
                .value

            ) {

              loadSlots();

            }

          }

        );

      }

    );



  document
    .getElementById(
      'bookingForm'
    )

    .addEventListener(

      'submit',

      submitBooking

    );

}



/* =========================
   建立老師
========================= */

function setupPage(
  config
) {


  publicConfig =
    config;


  const grid =

    document
      .getElementById(
        'teacherGrid'
      );


  grid.innerHTML =
    '';


  config.teachers
    .forEach(
      teacher => {


        const wrap =

          document
            .createElement(
              'div'
            );


        wrap.className =
          'option';


        let description =
          '';


        if (

          teacher.key ===
          'male'

        ) {

          description =
            '理性分析｜事業・健康・人生方向';

        } else {

          description =
            '關係探索｜感情・財務・自我理解';

        }


        wrap.innerHTML = `

          <input
            type="radio"
            id="teacher_${teacher.key}"
            name="teacher"
            value="${teacher.key}"
            required
          >

          <label
            for="teacher_${teacher.key}"
          >

            <div class="option-title">

              ${teacher.label}

            </div>

            <div class="option-desc">

              ${description}

            </div>

          </label>

        `;


        grid.appendChild(
          wrap
        );


        wrap
          .querySelector(
            'input'
          )

          .addEventListener(

            'change',

            e => {


              selectedTeacher =
                e.target.value;


              updateDateAvailability();


              resetTime();


              if (

                selectedConsultType

                &&

                document
                  .getElementById(
                    'date'
                  )
                  .value

              ) {

                loadSlots();

              }

            }

          );

      }

    );


  setupDateRange();

}



/* =========================
   日期範圍
========================= */

function setupDateRange() {


  const dateInput =

    document
      .getElementById(
        'date'
      );


  const today =
    new Date();


  const minDate =

    new Date(

      today.getTime()

      +

      publicConfig
        .minAdvanceHours

      *

      60 * 60 * 1000

    );


  const maxDate =
    new Date(
      today
    );


  maxDate.setDate(

    maxDate.getDate()

    +

    publicConfig
      .bookingDaysAhead

  );


  dateInput.min =

    formatDateInput(
      minDate
    );


  dateInput.max =

    formatDateInput(
      maxDate
    );

}



/* =========================
   是否可以選日期
========================= */

function updateDateAvailability() {


  const dateInput =

    document
      .getElementById(
        'date'
      );


  dateInput.disabled =

    !(

      selectedTeacher

      &&

      selectedConsultType

    );


  if (
    dateInput.disabled
  ) {

    resetTime();

  }

}



/* =========================
   日期格式
========================= */

function formatDateInput(
  date
) {


  const y =
    date.getFullYear();


  const m =

    String(

      date.getMonth() + 1

    )

    .padStart(
      2,
      '0'
    );


  const d =

    String(

      date.getDate()

    )

    .padStart(
      2,
      '0'
    );


  return `${y}-${m}-${d}`;

}



/* =========================
   重設時間
========================= */

function resetTime() {


  const select =

    document
      .getElementById(
        'time'
      );


  select.disabled =
    true;


  select.innerHTML = `

    <option value="">

      請先選擇老師、諮詢方式與日期

    </option>

  `;


  document
    .getElementById(
      'slotStatus'
    )
    .textContent =
      '';

}



/* =========================
   讀取時段
========================= */

function loadSlots() {


  const date =

    document
      .getElementById(
        'date'
      )
      .value;


  const select =

    document
      .getElementById(
        'time'
      );


  const status =

    document
      .getElementById(
        'slotStatus'
      );


  if (

    !selectedTeacher

    ||

    !selectedConsultType

    ||

    !date

  ) {

    resetTime();

    return;

  }


  select.disabled =
    true;


  select.innerHTML = `

    <option value="">

      讀取可預約時段中…

    </option>

  `;


  status.className =
    'status';


  status.textContent =
    '正在確認老師的行事曆…';


  google.script.run

    .withSuccessHandler(
      slots => {


        select.innerHTML =
          '';


        // =========================
        // 當天額滿
        // =========================

        if (
          !slots.length
        ) {


          select.disabled =
            true;


          select.innerHTML = `

            <option value="">

              當天已預約滿

            </option>

          `;


          status.className =
            'status error';


          status.textContent =

            '當天已預約滿，請選擇其他天。';


          return;

        }


        select.disabled =
          false;


        select.innerHTML = `

          <option value="">

            請選擇時段

          </option>

        `

        +

        slots
          .map(
            t => `

              <option value="${t}">

                ${t}

              </option>

            `
          )

          .join('');


        status.className =
          'status success';


        if (

          selectedConsultType ===
          '現場'

        ) {

          status.textContent =

            `目前有 ${slots.length} 個可預約時段，現場最晚 20:00。`;

        } else {

          status.textContent =

            `目前有 ${slots.length} 個可預約時段。`;

        }

      }

    )


    .withFailureHandler(
      err => {


        select.disabled =
          true;


        select.innerHTML = `

          <option value="">

            讀取失敗

          </option>

        `;


        status.className =
          'status error';


        status.textContent =

          err.message

          ||

          '讀取時段失敗。';

      }

    )


    .getAvailableSlots(

      selectedTeacher,

      date,

      selectedConsultType

    );

}



/* =========================
   送出預約
========================= */

function submitBooking(
  e
) {


  e.preventDefault();


  const form =
    e.currentTarget;


  const submitBtn =

    document
      .getElementById(
        'submitBtn'
      );


  const submitStatus =

    document
      .getElementById(
        'submitStatus'
      );


  const topicValues = [

    ...form.querySelectorAll(
      'input[name="topics"]:checked'
    )

  ]

  .map(
    el =>
      el.value
  );


  const payload = {


    name:

      form
        .name
        .value
        .trim(),


    gender:

      form
        .gender
        .value,


    lineId:

      form
        .lineId
        .value
        .trim(),


    igAccount:

      form
        .igAccount
        .value
        .trim(),


    birthDate:

      form
        .birthDate
        .value,


    birthTime:

      form
        .birthTime
        .value,


    birthPlace:

      form
        .birthPlace
        .value
        .trim(),


    teacherKey:

      selectedTeacher,


    consultType:

      selectedConsultType,


    date:

      form
        .date
        .value,


    time:

      form
        .time
        .value,


    topics:

      topicValues,


    question:

      form
        .question
        .value
        .trim()

  };


  submitBtn.disabled =
    true;


  submitBtn.textContent =
    '正在建立預約…';


  submitStatus.className =
    'status';


  submitStatus.textContent =

    '系統正在再次確認時段，避免撞期。';


  google.script.run

    .withSuccessHandler(
      result => {


        document
          .getElementById(
            'formArea'
          )
          .style.display =
            'none';


        document
          .getElementById(
            'successArea'
          )
          .style.display =
            'block';


        document
          .getElementById(
            'successText'
          )
          .innerHTML =

            `你已成功預約 <strong>${result.teacher}</strong><br>`

            +

            `諮詢方式：${result.consultType}<br>`

            +

            `${result.date}　${result.time}<br><br>`

            +

            `系統已同步建立到老師的 Google Calendar。`;


        if (
          result.officialLineUrl
        ) {


          const link =

            document
              .getElementById(
                'lineLink'
              );


          link.href =
            result.officialLineUrl;


          link.style.display =
            'inline-block';

        }

      }

    )


    .withFailureHandler(
      err => {


        submitBtn.disabled =
          false;


        submitBtn.textContent =
          '確認送出預約';


        submitStatus.className =
          'status error';


        submitStatus.textContent =

          err.message

          ||

          '預約失敗，請重新確認資料。';


        loadSlots();

      }

    )


    .createBooking(
      payload
    );

}



/* =========================
   系統錯誤
========================= */

function showFatal(
  err
) {


  document.body.innerHTML = `

    <div class="wrap">

      <div class="card">

        <h2>
          系統設定尚未完成
        </h2>

        <p class="error">

          ${
            err.message
            ||
            '讀取設定失敗。'
          }

        </p>

      </div>

    </div>

  `;

}
